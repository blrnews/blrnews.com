<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — BLRnews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo">BLR<span>news</span></a>
      <nav class="nav-links">
        <a href="#">City</a><a href="#">Traffic</a><a href="#">Politics</a><a href="#">Tech</a><a href="#">Sports</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width:600px; padding: 40px 20px;">
    <h1 style="font-size:28px; margin-bottom:6px;">Contact BLRnews</h1>
    <p style="color:#888; margin-bottom:28px;">Send us a tip, story idea, or feedback</p>

    <!-- Replace the action URL below with your Formspree or Google Form embed URL -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
      <label>Your name
        <input type="text" name="name" placeholder="Ravi Kumar" required />
      </label>
      <label>Email address
        <input type="email" name="email" placeholder="ravi@example.com" required />
      </label>
      <label>Subject
        <input type="text" name="subject" placeholder="Story tip / Feedback / Other" />
      </label>
      <label>Message
        <textarea name="message" rows="5" placeholder="Tell us what's on your mind..." required></textarea>
      </label>
      <button type="submit">Send message →</button>
    </form>

    <p style="margin-top:24px; font-size:13px; color:#888;">
      You can also email us directly at <a href="mailto:hello@blrnews.com">hello@blrnews.com</a>
    </p>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="logo">BLR<span>news</span></span>
      <nav class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="#">Privacy</a>
      </nav>
      <span class="footer-copy">© 2026 BLRnews</span>
    </div>
  </footer>

</body>
</html>
